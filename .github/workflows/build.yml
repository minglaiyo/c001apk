name: Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'private-extensions.lock.json'
  pull_request:
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'private-extensions.lock.json'
  workflow_dispatch:
    inputs:
      android_release:
        description: 'Build Android with the official release certificate (requires Secrets)'
        type: boolean
        default: true
      ios:
        description: 'Also build an unsigned iOS arm64 IPA (requires your own signing)'
        type: boolean
        default: false
      implementation:
        description: 'Official private implementation or public basic implementation'
        type: choice
        options: [official, public]
        default: official

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'
  USE_PRIVATE_EXTENSIONS: ${{ github.repository == 'TG-Twilight/c001apk' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || inputs.implementation != 'public') }}

defaults:
  run:
    working-directory: apps/flutter

jobs:
  checks:
    name: Offline checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      build_date: ${{ steps.version.outputs.date }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate official build branch
        if: github.repository == 'TG-Twilight/c001apk' && github.event_name == 'workflow_dispatch' && inputs.implementation != 'public' && github.ref != 'refs/heads/main'
        run: echo 'Official implementation builds require the main branch'; exit 1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve build date (UTC+8)
        id: version
        run: dart tool/update_build_date.dart
      - run: flutter pub get --enforce-lockfile
      - name: Assemble official implementation
        if: env.USE_PRIVATE_EXTENSIONS == 'true'
        uses: ./.github/actions/private-extensions
        with:
          private-key: ${{ secrets.PRIVATE_EXTENSIONS_DEPLOY_KEY }}
      - name: Analyze (errors and warnings fail; existing info lints remain visible)
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Offline regression tests
        run: flutter test --no-pub

  android-release:
    name: Android release (own keystore)
    # Fork-only Android-only release variant. Do not merge upstream.
    # Desktop, android-release (official) and ios jobs are removed: a run
    # produces only the c001apk-android-release artifact.
    # checks still runs in parallel (analyze/test, for information)
    # but no longer blocks this job, so an APK is produced even
    # if checks fail. workflow_dispatch inputs android_release / ios
    # are ignored on this branch: this job always runs (except PRs).
    # Fork-only variant: instead of the upstream official certificate
    # Secrets and official fingerprint check, this variant restores the
    # user's own long-term keystore from Secrets MY_KEYSTORE_BASE64 and
    # MY_KS_PASS (alias myapp, same store/key password).
    # No official fingerprint is checked, because this signature is the
    # user's own, not the official one. Every build with this keystore
    # has the same signature, so it can overwrite previous builds signed
    # with the same keystore, but NOT an official-signed install or a
    # temporary-certificate debug install: uninstall those first.
    # Do not merge this variant upstream.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Select JDK and install Android SDK packages
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
      - name: Sync build date
        run: dart tool/update_build_date.dart
      - run: flutter pub get --enforce-lockfile
      - name: Assemble official implementation
        if: env.USE_PRIVATE_EXTENSIONS == 'true'
        uses: ./.github/actions/private-extensions
        with:
          private-key: ${{ secrets.PRIVATE_EXTENSIONS_DEPLOY_KEY }}
      - name: Restore own long-term keystore from Secrets
        env:
          MY_KEYSTORE_BASE64: ${{ secrets.MY_KEYSTORE_BASE64 }}
          MY_KS_PASS: ${{ secrets.MY_KS_PASS }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/c001apk-signing"
          printf '%s' "$MY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/c001apk-signing/release.jks"
          printf 'KEYSTORE=%s\n' "$RUNNER_TEMP/c001apk-signing/release.jks" >> "$GITHUB_ENV"
          printf 'KEY_ALIAS=myapp\n' >> "$GITHUB_ENV"
          printf 'KEYSTORE_PASSWORD=%s\n' "$MY_KS_PASS" >> "$GITHUB_ENV"
          printf 'KEY_PASSWORD=%s\n' "$MY_KS_PASS" >> "$GITHUB_ENV"
          printf 'REVIA_KS_PASS=%s\n' "$MY_KS_PASS" >> "$GITHUB_ENV"
      - name: Build release APKs with own keystore
        run: flutter build apk --release --split-per-abi --no-pub
      - name: Remove restored signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/c001apk-signing/release.jks" "$RUNNER_TEMP/c001apk-signing/cert.der"
          rmdir "$RUNNER_TEMP/c001apk-signing" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: c001apk-android-release
          path: apps/flutter/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 7

